# Publish the log mirror to Pages, but only a snapshot that verifies.
#
# WHO CAN DO WHAT. The host holds a deploy key that can push to this repository. A ruleset blocks
# it from `main`, so it can write only the `incoming` branch. This workflow and the pinned key live
# on `main`, and every run of THIS workflow executes main's copy of it, whatever started the run.
#
# WHAT STARTS IT. GitHub's scheduler barely runs on this account (once in 11 hours on 2026-09-23),
# so a snapshot also starts it: the host's push to `incoming` runs `snapshot-arrived`, a no-op
# workflow that lives on `incoming`, and its completion starts this one through workflow_run. The
# host needs no token for that. It controls only the no-op file: it can start a verification or
# stop starting one, and it cannot change what is verified or what is published.
#
# IF VERIFICATION FAILS, NOTHING IS PUBLISHED and the job ends red. Pages keeps serving the last
# snapshot that passed.

name: publish

on:
  schedule:
    # Not :00 or :30. GitHub drops scheduled runs under load, and the top and bottom of the hour
    # are when it is loaded; between 04:08 and 06:40 on 2026-09-23 not one :00/:30 run started.
    - cron: '17,47 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [snapshot-arrived]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  # Reading this run's own artifact list, to know the upload is visible before the deploy asks.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES: https://dancenitra.github.io/inspeximus-log
  # The second copy of the key, beside the vkey file. It must equal the reference value printed
  # and stored off-line; changing one without the other fails the run.
  EXPECT_KEY: 9fb780dd72894867c6dac8e140cc78d755617147d20cfd26bfe557190f65ac49

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: incoming
          path: incoming
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "inspeximus==3.7.0" cryptography

      # THE FIRST LOG IS FROZEN, so it is checked against a manifest, not against itself. Every
      # file the host pushes under log/ must hash to the manifest on main, and no file may be added
      # or dropped. A changed byte there is a rewrite of a log we told people is closed.
      - name: The first log is exactly the frozen one
        run: |
          cd incoming/log
          sha256sum --check --quiet --strict ../../trust/frozen-v1.sha256
          test "$(find . -type f | wc -l)" -eq "$(wc -l < ../../trust/frozen-v1.sha256)"

      - name: The current log verifies against its pinned key and extends the live head
        run: |
          python verify_snapshot.py --snapshot incoming/current --vkey trust/checkpoint-v2.vkey             --expect-key "$EXPECT_KEY" --previous "$PAGES" --baseline trust/baseline-head-v2.json

      - name: The current log continues the first one
        run: |
          python verify_succession.py --first incoming/log --current incoming/current             --first-vkey trust/checkpoint.vkey --current-vkey trust/checkpoint-v2.vkey

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r incoming/current/. site/
          cp -r incoming/log site/log
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # ARTIFACT METADATA IS EVENTUALLY CONSISTENT, so the deploy can ask too early. On 2026-11-17
      # and again on 2026-11-19 the upload finished, the deploy asked about half a second later,
      # and the API answered "Found 0 artifact(s)". The run went red although every verification
      # step had passed and the artifact existed. This step waits until the API reports exactly one
      # artifact. Two is also fatal to the deploy, so it fails fast and says why.
      - name: The artifact is visible to the deploy API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"                   --jq '[.artifacts[] | select(.expired == false)] | length')
            echo "attempt $i: $n artifact(s)"
            if [ "$n" -eq 1 ]; then exit 0; fi
            if [ "$n" -gt 1 ]; then
              echo "::error::$n artifacts named github-pages. The deploy accepts exactly one."
              exit 1
            fi
            sleep 2
          done
          echo "::error::the uploaded artifact never became visible to the API"
          exit 1

      - id: deploy
        uses: actions/deploy-pages@v4
