# Publish the log mirror to Pages, but only a snapshot that verifies.
#
# WHO CAN DO WHAT. The host holds a deploy key that can push to this repository. A ruleset blocks
# it from `main`, so it can write only the `incoming` branch. This workflow and the pinned key live
# on `main`, and scheduled and manual runs always execute main's copy of this file. A host that
# pushed a changed workflow to `incoming` would change nothing that runs.
#
# IF VERIFICATION FAILS, NOTHING IS PUBLISHED and the job ends red. Pages keeps serving the last
# snapshot that passed.

name: publish

on:
  schedule:
    # Not :00 or :30. GitHub drops scheduled runs under load, and the top and bottom of the hour
    # are when it is loaded; between 04:08 and 06:40 on 2026-09-23 not one :00/:30 run started.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES: https://dancenitra.github.io/inspeximus-log
  # The second copy of the key, beside the vkey file. It must equal the reference value printed
  # and stored off-line; changing one without the other fails the run.
  EXPECT_KEY: 9fb780dd72894867c6dac8e140cc78d755617147d20cfd26bfe557190f65ac49

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: incoming
          path: incoming
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "inspeximus==3.7.0" cryptography

      # THE FIRST LOG IS FROZEN, so it is checked against a manifest, not against itself. Every
      # file the host pushes under log/ must hash to the manifest on main, and no file may be added
      # or dropped. A changed byte there is a rewrite of a log we told people is closed.
      - name: The first log is exactly the frozen one
        run: |
          cd incoming/log
          sha256sum --check --quiet --strict ../../trust/frozen-v1.sha256
          test "$(find . -type f | wc -l)" -eq "$(wc -l < ../../trust/frozen-v1.sha256)"

      - name: The current log verifies against its pinned key and extends the live head
        run: |
          python verify_snapshot.py --snapshot incoming/current --vkey trust/checkpoint-v2.vkey             --expect-key "$EXPECT_KEY" --previous "$PAGES" --baseline trust/baseline-head-v2.json

      - name: The current log continues the first one
        run: |
          python verify_succession.py --first incoming/log --current incoming/current             --first-vkey trust/checkpoint.vkey --current-vkey trust/checkpoint-v2.vkey

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r incoming/current/. site/
          cp -r incoming/log site/log
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
