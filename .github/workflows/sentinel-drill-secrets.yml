# DRILL, removed right after it runs: what a workflow pushed to incoming can read.
name: sentinel-drill-secrets
on:
  push:
    branches: [incoming]
permissions: {}
jobs:
  repo-secret:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.NOTIFY_BOT_TOKEN }}
        run: echo "repo-level NOTIFY_BOT_TOKEN length ${#T}"
  env-secret:
    runs-on: ubuntu-latest
    environment: notify
    steps:
      - env:
          T: ${{ secrets.NOTIFY_BOT_TOKEN }}
        run: echo "environment NOTIFY_BOT_TOKEN length ${#T}"
